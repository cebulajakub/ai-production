services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-production-backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: database
      DB_PORT: "1433"
      DB_NAME: ProductionCopilotDB
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
    restart: unless-stopped

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ai-production-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqlserver_data: