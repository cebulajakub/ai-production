services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-production-backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: database
      DB_PORT: "1433"
      DB_NAME: ProductionCopilotDB
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      EMBEDDING_MODEL: "bge-m3"
      QDRANT_COLLECTION: "manufacturing_knowledge_v2"
      RAG_TOP_K: "3"
      RAG_SCORE_THRESHOLD: "0.50"
      APP_ENV: "development"
      CORS_ALLOWED_ORIGINS: "http://localhost:4200"
    restart: unless-stopped
    volumes:
      - ./documents:/app/documents:ro

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ai-production-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
  
  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ai-production-frontend:local
    container_name: ai-production-frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlserver_data:
  qdrant_data: